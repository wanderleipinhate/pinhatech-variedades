services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinhatech_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persiste o arquivo do banco de dados SQLite localmente no host
      - ./pinhatech.db:/app/pinhatech.db
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
