<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" width="380" height="60">
  <defs>
    <linearGradient id="logoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
  </defs>
  
  <!-- Símbolo: Engrenagem + Raio -->
  <g transform="translate(5, 5)">
    <rect width="50" height="50" rx="12" fill="#1A1A1A" stroke="#FF6B00" stroke-width="2"/>
    <polygon points="28,10 16,28 25,28 21,42 36,23 26,23" fill="url(#logoOrange)" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  
  <!-- Tipografia PINHATECH -->
  <text x="68" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    PINHA<tspan fill="#FF6B00">TECH</tspan>
  </text>
  
  <!-- Subtítulo & VARIEDADES -->
  <text x="69" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#B3B3B3" letter-spacing="4">
    &amp; VARIEDADES
  </text>
</svg>
