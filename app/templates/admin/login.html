<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | {{ app_name }}</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#0F0F0F',
                            card: '#1A1A1A',
                            border: '#2A2A2A',
                            orange: '#FF6B00',
                            'orange-hover': '#FF8533',
                            green: '#10B981',
                            muted: '#B3B3B3',
                            white: '#FFFFFF'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-brand-black text-white min-h-screen flex items-center justify-center p-4 bg-grid-pattern">

    <div class="max-w-md w-full space-y-6">
        
        <!-- Logo e Cabeçalho de Acesso -->
        <div class="text-center space-y-2">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-brand-card border border-brand-orange items-center justify-center shadow-lg shadow-brand-orange/20">
                <i data-lucide="shield-lock" class="w-7 h-7 text-brand-orange"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wide text-white">
                PINHA<span class="text-brand-orange">TECH</span> & VARIEDADES
            </h1>
            <p class="text-xs text-brand-muted uppercase tracking-widest font-semibold">
                Painel Administrativo Restrito
            </p>
        </div>

        <!-- Card de Formulário -->
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <!-- Mensagem de Erro -->
            {% if error %}
            <div class="p-3.5 rounded-xl bg-red-950/60 border border-red-500/50 flex items-center gap-3 text-red-200 text-xs">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-red-400 shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/admin/login" method="POST" class="space-y-4">
                <input type="hidden" name="next" value="{{ next }}">

                <!-- Campo Usuário -->
                <div class="space-y-1.5">
                    <label for="username" class="text-xs font-semibold uppercase tracking-wider text-brand-muted">
                        Usuário
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            name="username" 
                            id="username" 
                            required 
                            placeholder="admin"
                            class="w-full bg-brand-black border border-brand-border rounded-xl px-4 py-2.5 pl-11 text-sm text-white focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange"
                        >
                        <i data-lucide="user" class="w-4 h-4 text-brand-muted absolute left-4 top-3.5"></i>
                    </div>
                </div>

                <!-- Campo Senha -->
                <div class="space-y-1.5">
                    <label for="password" class="text-xs font-semibold uppercase tracking-wider text-brand-muted">
                        Senha de Acesso
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            name="password" 
                            id="password" 
                            required 
                            placeholder="••••••••••••"
                            class="w-full bg-brand-black border border-brand-border rounded-xl px-4 py-2.5 pl-11 text-sm text-white focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange"
                        >
                        <i data-lucide="lock" class="w-4 h-4 text-brand-muted absolute left-4 top-3.5"></i>
                    </div>
                </div>

                <!-- Botão Entrar -->
                <button 
                    type="submit" 
                    class="btn-cta-orange w-full py-3 px-4 rounded-xl text-xs sm:text-sm font-bold uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg"
                >
                    <span>Entrar no Painel</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <!-- Voltar para o Site -->
        <div class="text-center">
            <a href="/" class="text-xs text-brand-muted hover:text-white flex items-center justify-center gap-1.5 transition-colors">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Voltar para a Vitrine Pública</span>
            </a>
        </div>
    </div>

    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
